# CONFIG.yml - ICESat-2 Analysis Configuration
# Copy this file to your scripts directory as CONFIG.yml

# ============================================================================
# PATHS
# ============================================================================
paths:
  base_output_dir: "E:\\Processing\\ICeSat-2\\output_data"
  insar_dir: "C:\\final_products"

# ============================================================================
# COLUMN MAPPINGS - Update based on your actual CSV column names
# ============================================================================
columns:
  latitude: "lat_avg"           # or lat_early, latitude, Latitude (deg)
  longitude: "lon_avg"          # or lon_early, longitude, Longitude (deg)
  subsidence_rate: "subsidence_rate_m_per_year"  # or dH, rate
  elevation_change: "dH"
  year_early: "year_early"
  year_late: "year_late"

# ============================================================================
# VISUALIZATION SETTINGS
# ============================================================================
visualization:
  dpi: 300
  colormap_subsidence: "RdBu_r"
  colormap_density: "viridis"
  subsidence_vmin: -0.2
  subsidence_vmax: 0.2

# ============================================================================
# FILTERING & QUALITY CONTROL
# ============================================================================
filtering:
  min_neighbor_count: 100
  outlier_sigma: 3
  min_time_separation_days: 10
  max_time_separation_days: 2000

# ============================================================================
# InSAR VALIDATION
# ============================================================================
validation:
  insar_file: "icesat2_insar_integrated.csv"
  insar_columns:
    subsidence_rate: "insar_subsidence_rate_mm_yr"
    latitude: "lat_avg"
    longitude: "lon_avg"
  min_pairs_for_correlation: 10

# ============================================================================
# GIS EXPORT
# ============================================================================
gis:
  formats:
    output_dir: "GIS_exports"
    shapefile: true
    geopackage: true
    map_projection: "EPSG:26908"
  
  field_metadata:
    subsidence_rate_m_per_year:
      alias: "Subsidence Rate"
      units: "m/yr"
      description: "Annual subsidence rate from ICESat-2 crossover analysis"
    
    dH:
      alias: "Elevation Change"
      units: "m"
      description: "Total elevation change between measurement dates"
    
    neighbor_count:
      alias: "Neighbor Count"
      units: "unitless"
      description: "Number of other crossovers within search radius"
